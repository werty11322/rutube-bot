name: Run proxy test

on:
  workflow_dispatch:

jobs:
  test-proxies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run proxy test
        run: |
          python test_proxies.py
