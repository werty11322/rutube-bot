name: Run Rutube Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  rutube-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          # Устанавливаем Chrome
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          
          # Получаем точную версию Chrome
          CHROME_VER=$(google-chrome --version | grep -oP '\d+(?=\.\d+\.\d+\.\d+)')
          echo "Chrome major version: $CHROME_VER"
          
          # Скачиваем ChromeDriver через официальный API
          wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VER}.0.7778.96/linux64/chromedriver-linux64.zip" || \
          wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VER}.0.7778.96/linux64/chromedriver-linux64.zip"
          
          unzip -o chromedriver-linux64.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          
          echo "=== ВЕРСИИ ==="
          google-chrome --version
          chromedriver --version
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run bot
        run: python -u bot.py
