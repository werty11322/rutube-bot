name: Simple
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python3 -m pip install requests
      - name: Run Python script
        run: |
          python3 << 'EOF'
          import requests
          import time
          import random

          VIDEO_ID = "6cfdb12ee510423801689f51ff73e8a3"
          BASE_URL = f"https://goya.rutube.ru/v2/online/{VIDEO_ID}/"

          for i in range(3):
              cid = str(random.randint(10**12, 10**13-1))
              session_id = f"{cid}_{int(time.time()*1000)}"
              user_id = random.randint(10000000, 99999999)
              player_view_id = random.randint(1000000000, 9999999999)
              start_time = int(time.time()*1000)

              # 1. play_start
              params_start = {
                  "event_name": "play_start",
                  "cid": cid,
                  "session_id": session_id,
                  "user_id": user_id,
                  "event_timestamp": start_time,
                  "page_url": f"https://rutube.ru/video/{VIDEO_ID}/",
              }
              requests.post(BASE_URL, params=params_start, timeout=10)
              
              # 2. Несколько heartbeat
              for step in range(6):  # 6 пульсов = ~3 минуты
                  time.sleep(30)
                  params_heart = {
                      "event_name": "heartbeat",
                      "cid": cid,
                      "session_id": session_id,
                      "user_id": user_id,
                      "event_timestamp": int(time.time()*1000),
                      "range_start": step * 30000,
                      "range_end": (step + 1) * 30000,
                      "video_watchtime": (step + 1) * 30,
                  }
                  requests.post(BASE_URL, params=params_heart, timeout=10)
                  print(f"{i+1}/20: пульс {step+1}/6")

              # 3. play_end
              params_end = {
                  "event_name": "play_end",
                  "cid": cid,
                  "session_id": session_id,
                  "user_id": user_id,
                  "event_timestamp": int(time.time()*1000),
                  "range_end": 180000,
                  "final": 1,
              }
              requests.post(BASE_URL, params=params_end, timeout=10)
              print(f"{i+1}/20: просмотр завершён")

          print("Готово!")
          EOF
